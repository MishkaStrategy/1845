name: Check, build and publish static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Syntax check and production build
        run: npm run check
      - name: Stage standalone commercial concept
        run: |
          mkdir -p dist/1845-commercial-concept
          cp 1845-commercial-concept/index.html dist/1845-commercial-concept/index.html
          cp 1845-commercial-concept/nixie-hero.css dist/1845-commercial-concept/nixie-hero.css
          cp 1845-commercial-concept/nixie-hero.js dist/1845-commercial-concept/nixie-hero.js
          cp 1845-commercial-concept/nixie-loader.js dist/1845-commercial-concept/nixie-loader.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/1845-commercial-concept/index.html')
          s = p.read_text()
          s = s.replace('</body>', '<script src="./nixie-loader.js"></script></body>')
          p.write_text(s)
          PY
      - name: Publish dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach /tmp/1845-pages origin/gh-pages
          rsync -a --delete --exclude=.git dist/ /tmp/1845-pages/
          cd /tmp/1845-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes"
          else
            git commit -m "deploy: ${GITHUB_SHA}"
            git push origin HEAD:gh-pages --force
          fi
