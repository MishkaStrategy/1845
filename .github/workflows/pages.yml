name: Check, build and publish static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Syntax check and production build
        run: npm run check
      - name: Stage standalone commercial concept
        run: |
          mkdir -p dist/1845-commercial-concept
          cp 1845-commercial-concept/index.html dist/1845-commercial-concept/index.html
          cp 1845-commercial-concept/nixie-hero.css dist/1845-commercial-concept/nixie-hero.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/1845-commercial-concept/index.html')
          s = p.read_text()
          old = '<div class="door" id="door"><div class="panel l"></div><div class="panel r"></div><strong>1845</strong></div>'
          new = '''<div class="nixie-stage" role="img" aria-label="18:45 — светящиеся газоразрядные Nixie-индикаторы"><div class="nixie-clock" aria-hidden="true"><div class="nixie-tube"><span class="nixie-digit" data-digit="1">1</span></div><div class="nixie-tube"><span class="nixie-digit" data-digit="8">8</span></div><span class="nixie-colon"><i></i><i></i></span><div class="nixie-tube"><span class="nixie-digit" data-digit="4">4</span></div><div class="nixie-tube"><span class="nixie-digit" data-digit="5">5</span></div></div><div class="nixie-base" aria-hidden="true"></div><p class="nixie-caption"><b>18:45</b> · момент, когда город остаётся снаружи</p></div>'''
          if old not in s:
              raise SystemExit('Hero door marker not found')
          s = s.replace(old, new, 1)
          s = s.replace('</head>', '<link rel="stylesheet" href="./nixie-hero.css?v=5"></head>', 1)
          p.write_text(s)
          PY
      - name: Publish dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach /tmp/1845-pages origin/gh-pages
          rsync -a --delete --exclude=.git dist/ /tmp/1845-pages/
          cd /tmp/1845-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes"
          else
            git commit -m "deploy: ${GITHUB_SHA}"
            git push origin HEAD:gh-pages --force
          fi
