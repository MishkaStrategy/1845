name: Check, build and publish static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Syntax check and production build
        run: npm run check
      - name: Publish dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach /tmp/1845-pages origin/gh-pages
          rsync -a --delete --exclude=.git dist/ /tmp/1845-pages/
          cd /tmp/1845-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes"
          else
            git commit -m "deploy: ${GITHUB_SHA}"
            git push origin HEAD:gh-pages --force
          fi
