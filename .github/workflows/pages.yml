name: Check, build and publish static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Syntax check and production build
        run: npm run check
      - name: Stage standalone commercial concept
        run: |
          mkdir -p dist/1845-commercial-concept
          cp 1845-commercial-concept/index.html dist/1845-commercial-concept/index.html
          cp 1845-commercial-concept/nixie-hero.css dist/1845-commercial-concept/nixie-hero.css
          cp 1845-commercial-concept/nixie-3d.js dist/1845-commercial-concept/nixie-3d.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/1845-commercial-concept/index.html')
          s=p.read_text()
          old='<div class="door" id="door"><div class="panel l"></div><div class="panel r"></div><strong>1845</strong></div>'
          def tube(d):
              return f'''<div class="n3-tube"><div class="n3-cathode-stack"><span class="n3-ghost g1">{d}</span><span class="n3-ghost g2">{d}</span><span class="n3-live" data-digit="{d}">{d}</span></div><div class="n3-electrodes"></div><div class="n3-glass"></div><div class="n3-base"></div></div>'''
          new='''<div class="nixie3d" role="img" aria-label="18:45 — интерактивная трёхмерная Nixie-инсталляция"><div class="nixie3d-scene"><div class="nixie3d-shadow"></div>'''+tube('1')+tube('8')+'''<span class="n3-colon"><i></i><i></i></span>'''+tube('4')+tube('5')+'''</div><p class="nixie3d-caption"><b>18:45</b> · момент, когда город остаётся снаружи</p></div>'''
          if old not in s: raise SystemExit('Hero marker not found')
          s=s.replace(old,new,1)
          s=s.replace('</head>','<link rel="stylesheet" href="./nixie-hero.css?v=6"></head>',1)
          s=s.replace('</body>','<script src="./nixie-3d.js?v=6"></script></body>',1)
          p.write_text(s)
          PY
      - name: Publish dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach /tmp/1845-pages origin/gh-pages
          rsync -a --delete --exclude=.git dist/ /tmp/1845-pages/
          cd /tmp/1845-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes"
          else
            git commit -m "deploy: ${GITHUB_SHA}"
            git push origin HEAD:gh-pages --force
          fi
